name: Build test APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Create native project if needed
        run: if [ ! -f android/gradlew ]; then npx cap add android; fi
      - run: npm run android:prepare-update
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Moyenne-Master-DEBUG-not-for-release
          path: android/app/build/outputs/apk/debug/app-debug.apk
