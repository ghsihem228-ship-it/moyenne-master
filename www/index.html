<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1B52">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}</style>
<title>Moyenne Master</title>
<style>
/* Material 3 layout: sticky small top app bar, hero card, tonal cards, extended FAB, bottom sheet, snackbar, navigation bar (rail on wide screens). Deep blue primary, slate neutrals, green and red reserved for pass and fail. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --fg:#0E1626; --muted:#566377; --line:#E1E6EE; --outline:#8892A4;
  --shadow:0 1px 2px rgba(14,22,38,.05),0 6px 18px -8px rgba(14,22,38,.14);
  --accent:#1D4FC4; --accent-soft:#DDE7FF; --on-accent:#FFFFFF;
  --good:#0E8A49; --good-soft:#D8F2E4; --warn:#8F5C00; --warn-soft:#FBEED2; --bad:#C9291F; --bad-soft:#FBDDD9;
  --hero:#0C1E5B; --hero-hi:rgba(124,158,255,.42); --hero-pass:#095A32; --hero-pass-hi:rgba(92,232,164,.36); --hero-fail:#80160E; --hero-fail-hi:rgba(255,134,118,.36);
  --hero-fg:#F5F8FF; --hero-muted:#BDC9EC; --hero-track:rgba(255,255,255,.18);
  --ring-neu:#B7C8FF; --ring-ok:#C5F8DB; --ring-bad:#FFDAD5;
  --inverse:#1F2937; --on-inverse:#F3F5F9; --snack-act:#9DB6FF;
  --font:'Manrope','Segoe UI',Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F17; --surface:#131B26; --fg:#E8EDF5; --muted:#95A3B7; --line:#1F2A38; --outline:#6B7889; --shadow:none;
    --accent:#8AA6FF; --accent-soft:#1A2A52; --on-accent:#0A0F17;
    --good:#47D088; --good-soft:#12342A; --warn:#E8B04A; --warn-soft:#3A2D12; --bad:#FF8176; --bad-soft:#3E1D1B;
    --hero:#101D49; --hero-hi:rgba(112,142,255,.30); --hero-pass:#0B4A2E; --hero-pass-hi:rgba(72,212,142,.26); --hero-fail:#541511; --hero-fail-hi:rgba(255,112,100,.26);
    --inverse:#E3E8F0; --on-inverse:#121A25; --snack-act:#2F55C8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F17; --surface:#131B26; --fg:#E8EDF5; --muted:#95A3B7; --line:#1F2A38; --outline:#6B7889; --shadow:none;
  --accent:#8AA6FF; --accent-soft:#1A2A52; --on-accent:#0A0F17;
  --good:#47D088; --good-soft:#12342A; --warn:#E8B04A; --warn-soft:#3A2D12; --bad:#FF8176; --bad-soft:#3E1D1B;
  --hero:#101D49; --hero-hi:rgba(112,142,255,.30); --hero-pass:#0B4A2E; --hero-pass-hi:rgba(72,212,142,.26); --hero-fail:#541511; --hero-fail-hi:rgba(255,112,100,.26);
  --inverse:#E3E8F0; --on-inverse:#121A25; --snack-act:#2F55C8;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,summary{position:relative;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;padding-inline:16px;padding-block:0 170px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin-inline:auto}

/* top app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;margin-inline:-16px;background:var(--bg);transition:box-shadow .2s,background-color .2s}
.appbar.scrolled{background:color-mix(in srgb,var(--surface) 90%,var(--accent) 6%);box-shadow:0 2px 10px rgba(14,22,38,.14)}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.mark{flex:none;width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:1.1rem}
.ttl{min-width:0;flex:1}
h1{font-weight:800;font-size:1.375rem;line-height:1.25;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:.75rem;font-weight:500;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn svg{width:22px;height:22px}
.ibtn.sm{width:44px;height:44px;color:var(--muted)}
.ibtn.sm svg{width:20px;height:20px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view[hidden]{display:none}
.good{color:var(--good)} .bad{color:var(--bad)}

/* hero */
.hero{display:flex;gap:20px;align-items:center;background:radial-gradient(120% 130% at 100% 0%,var(--hero-hi),transparent 58%),var(--hero);color:var(--hero-fg);border-radius:28px;padding:20px;box-shadow:var(--shadow);margin-top:8px}
.hero.pass{background:radial-gradient(120% 130% at 100% 0%,var(--hero-pass-hi),transparent 58%),var(--hero-pass)}
.hero.fail{background:radial-gradient(120% 130% at 100% 0%,var(--hero-fail-hi),transparent 58%),var(--hero-fail)}
.ringbox{position:relative;flex:none;width:124px;height:124px}
.ring{width:100%;height:100%;display:block}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .trk{stroke:var(--hero-track)}
.ring .arc{stroke:var(--ring-neu)} .ring .arc.ok{stroke:var(--ring-ok)} .ring .arc.bad{stroke:var(--ring-bad)}
.rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.rv b{font-weight:800;font-size:1.75rem;letter-spacing:-.02em}
.rv span{font-size:.7rem;font-weight:600;color:var(--hero-muted)}
.herotxt{min-width:0;flex:1;display:grid;gap:10px}
.hcap{font-size:.6875rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--hero-muted)}
.hcr{display:flex;justify-content:space-between;font-weight:700;font-size:.875rem}
.hstats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:rgba(255,255,255,.13);border-radius:10px;padding:5px 10px;font-size:.75rem;font-weight:600;color:var(--hero-muted)}
.stat b{color:var(--hero-fg);font-weight:800;margin-left:3px}
.hero .bar{background:var(--hero-track)}
.hero .bar i{background:var(--ring-neu)} .hero .bar i.ok{background:var(--ring-ok)}
.hero .chip{background:rgba(255,255,255,.16);color:var(--hero-fg)}
.hero .chip.good,.hero .chip.bad{background:rgba(255,255,255,.24);color:#fff}
.hero .chip.warn{background:rgba(255,255,255,.16);color:#FFDC96}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.bar i.ok{background:var(--good)}
.chip{display:inline-flex;align-items:center;min-height:24px;font-size:.75rem;font-weight:700;padding:0 10px;border-radius:8px;background:var(--line);color:var(--muted);white-space:nowrap;justify-self:start}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}

/* cards */
.card,.mini,.ue{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.card{padding:16px;margin-block:12px}
.cap{font-size:.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{text-align:center;display:grid;gap:8px;justify-items:center;padding:22px 16px;background:var(--accent-soft);border-color:transparent;box-shadow:none}
.empty svg{width:120px;height:90px}
.empty b{font-size:1.0625rem;font-weight:800}
.empty p{margin:0;font-size:.875rem;font-weight:500;color:var(--muted);max-width:340px}
.goalh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tgv{font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
input[type=range]{width:100%;height:48px;margin:4px 0 0;accent-color:var(--accent);background:transparent;cursor:pointer}
.gt{font-size:.875rem;font-weight:500}
.gt b{font-weight:800}

/* UE */
.ue{margin-block:12px;overflow:hidden}
.ue.pass{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.ue.fail{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.uehead{width:100%;min-height:64px;display:flex;align-items:center;gap:10px;padding:12px 16px;background:transparent;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.uehead .t{flex:1;min-width:0;font-weight:700;font-size:1rem}
.uehead .t small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.uehead .ua{font-weight:800}
.uehead .chev{flex:none;width:20px;height:20px;color:var(--muted)}
.ue.collapsed .chev{transform:rotate(-90deg)}
.ue.collapsed .uebody{display:none}
.mod{padding:16px;border-top:1px solid var(--line);display:grid;gap:12px}
.mod.pass{background:color-mix(in srgb,var(--good) 7%,var(--surface))}
.mod.fail{background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.mtop{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.mname{font-weight:600;font-size:.9375rem;min-width:0;flex:1}
.mname select{width:100%;min-height:48px;font:inherit;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mmeta{font-size:.75rem;font-weight:500;color:var(--muted);margin-top:3px}
.badge{flex:none;min-width:66px;text-align:center;font-weight:800;font-size:1.0625rem;padding:7px 10px;border-radius:12px;background:var(--line);color:var(--muted)}
.badge.good{background:var(--good);color:#fff} .badge.bad{background:var(--bad);color:#fff}
:root[data-theme="dark"] .badge.good,:root[data-theme="dark"] .badge.bad{color:#0A1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.good,:root:not([data-theme="light"]) .badge.bad{color:#0A1018}}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:5px;font-size:.6875rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
input.g{width:100%;height:52px;font:inherit;font-weight:700;font-size:1.1875rem;text-align:center;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:0 10px}
input.g:focus{border-color:var(--accent);background:var(--surface)}
input.g.ok{border-color:var(--good)} input.g.no{border-color:var(--bad)}
input.g.err{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-size:.8125rem;font-weight:500;color:var(--muted)}
.hint:empty{display:none}
.hint.warn{color:var(--warn)} .hint.good{color:var(--good)} .hint.bad{color:var(--bad)}

/* breakdown */
details.bk{padding:0;overflow:hidden}
details.bk summary{min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:700;cursor:pointer;list-style:none}
details.bk summary::-webkit-details-marker{display:none}
details.bk summary .chev{width:20px;height:20px;color:var(--muted)}
details.bk[open] summary .chev{transform:rotate(180deg)}
details.bk .in{padding:0 16px 16px}

/* year */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-block:12px}
.mini{padding:16px}
.mini .mv{font-weight:800;font-size:1.75rem;letter-spacing:-.02em;line-height:1.3}
.mini .mc{display:flex;justify-content:space-between;font-size:.8125rem;font-weight:600;color:var(--muted);margin-top:8px}
.rows div{display:flex;justify-content:space-between;gap:12px;font-size:1rem;font-weight:600}
.rows b{font-weight:800}
.scale{font-size:.75rem;font-weight:500;color:var(--muted);margin:10px 0 0}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.ins{background:var(--bg);border-radius:16px;padding:12px}
.ins .iv{font-weight:800;font-size:1.5rem;letter-spacing:-.02em;line-height:1.3}
.ins .iv.warn{color:var(--warn)}
.ins .isub{font-size:.75rem;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins.empty2{grid-column:1/-1;text-align:center;display:grid;gap:10px;justify-items:center;font-size:.875rem;color:var(--muted)}
.bgrp{font-size:.75rem;font-weight:700;color:var(--muted);margin:14px 0 6px}
.brow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) 48px;gap:10px;align-items:center;margin-block:6px;font-size:.8125rem;font-weight:500}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{position:relative;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bf{display:block;height:100%;border-radius:99px;background:var(--muted)}
.bf.good{background:var(--good)} .bf.bad{background:var(--bad)}
.bt u{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--fg);opacity:.4}
.bv{text-align:right;font-weight:800}
.scroll{overflow-x:auto}
table.tr{width:100%;border-collapse:collapse;font-size:.8125rem}
table.tr th{font-size:.6875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px;border-bottom:1px solid var(--line)}
table.tr th:first-child,table.tr td:first-child{text-align:left}
table.tr td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-weight:600;vertical-align:top}
table.tr td:first-child{min-width:130px;font-weight:500}
table.tr tr.ueh td{background:var(--accent-soft);font-weight:700;font-size:.75rem}
table.tr tr.semh td{background:var(--hero);color:var(--hero-fg);font-weight:700}
table.tr tr.tot td{font-weight:800;border-bottom:0}

/* settings */
.seg{display:flex;gap:4px;background:var(--bg);border-radius:16px;padding:4px;margin-top:10px}
.seg button{flex:1;min-height:48px;font:inherit;font-size:.875rem;font-weight:600;padding:0 6px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(14,22,38,.2)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{min-height:48px;font:inherit;font-weight:700;font-size:.875rem;background:transparent;color:var(--accent);border:1px solid var(--outline);border-radius:24px;padding:0 20px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.how{font-size:.8125rem;font-weight:500;color:var(--muted)}
.how p{margin:0 0 6px}
#fallback{width:100%;margin-top:10px;font:inherit;font-size:.8rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:130px}

/* text fields (outlined, floating label) */
.tf{position:relative;margin-top:14px}
.tf input,.tf select{width:100%;height:58px;font:inherit;font-size:1rem;font-weight:600;color:var(--fg);background:transparent;border:1px solid var(--outline);border-radius:12px;padding:22px 14px 6px}
.tf input:focus,.tf select:focus{border:2px solid var(--accent);padding:21px 13px 5px}
.tf label{position:absolute;left:15px;top:18px;font-size:1rem;font-weight:500;color:var(--muted);pointer-events:none;transition:top .15s,font-size .15s}
.tf input:focus + label,.tf input:not(:placeholder-shown) + label,.tf.sel label{top:7px;font-size:.75rem;font-weight:700}
.tf input:focus + label{color:var(--accent)}

/* FAB */
.fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:25;height:56px;display:flex;align-items:center;gap:10px;padding:0 20px 0 16px;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:.9375rem;cursor:pointer;box-shadow:0 6px 16px -4px rgba(14,22,38,.4)}
.fab svg{width:24px;height:24px}

/* bottom sheet + snackbar */
#sheet{position:fixed;inset:0;z-index:150}
.scrim{position:absolute;inset:0;background:rgba(8,12,20,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:680px;margin-inline:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.grab{width:36px;height:4px;border-radius:2px;background:var(--outline);opacity:.5;margin:2px auto 12px}
.sheet h2{font-size:1.375rem;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .err{min-height:1.4em;font-size:.8125rem;font-weight:600;color:var(--bad);margin-top:8px}
.sheet .actions{justify-content:flex-end}
#snack{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:160;max-width:560px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--inverse);color:var(--on-inverse);border-radius:12px;padding:4px 4px 4px 16px;min-height:48px;font-size:.875rem;font-weight:600;box-shadow:0 8px 24px -6px rgba(0,0,0,.4)}
#snack button{min-height:44px;padding:0 14px;border:0;border-radius:20px;background:transparent;color:var(--snack-act);font:inherit;font-weight:800;cursor:pointer}

/* navigation bar */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,var(--accent) 6%);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.bottom .in{max-width:680px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding:0 2px;border:0;border-radius:16px;background:transparent;color:var(--muted);font:inherit;font-size:.75rem;font-weight:600;cursor:pointer;min-width:0}
nav.bottom button .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background-color .2s}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button .lb{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.bottom button .nv{display:none}
nav.bottom button[aria-selected="true"]{color:var(--fg);font-weight:800}
nav.bottom button[aria-selected="true"] .pill{background:var(--accent-soft);color:var(--accent)}

/* ripple */
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);pointer-events:none;animation:rp .55s ease-out forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}

/* splash */
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(90% 60% at 80% 0%,rgba(124,158,255,.4),transparent 60%),#0B1B52;color:#F5F8FF;transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
.sp-mark{width:84px;height:84px;border-radius:26px;background:#F5F8FF;color:#0B1B52;display:grid;place-items:center;font-weight:800;font-size:1.6rem;box-shadow:0 18px 40px -12px rgba(0,0,0,.5)}
.sp-name{font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin-top:6px}
.sp-sub{font-size:.8125rem;font-weight:500;color:#BDC9EC}

/* lock */
#lock{position:fixed;inset:0;z-index:100;background:radial-gradient(90% 50% at 50% 0%,var(--accent-soft),transparent 70%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
#lk-title{font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin:4px 0 0;text-align:center}
#lk-msg{min-height:1.4em;font-size:.9rem;font-weight:500;color:var(--muted);text-align:center;max-width:300px}
#lk-msg.bad{color:var(--bad)} #lk-msg.good{color:var(--good)}
#pad{position:relative;width:min(300px,78vw);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;margin-block:6px}
#pad svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#pad svg polyline{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
#pad.bad svg polyline{stroke:var(--bad)} #pad.good svg polyline{stroke:var(--good)}
.dot{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;display:grid;place-items:center;pointer-events:none}
.dot::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--muted);opacity:.7}

/* ---------- update ---------- */
function chip(node, text, cls){ node.textContent = text; node.className = 'chip' + (cls ? ' ' + cls : ''); }
function setChip(container, text, cls){ container.innerHTML = ''; var c = document.createElement('span'); chip(c, text, cls); container.appendChild(c); }
function setBar(id, cr, max){ var b = el(id); b.style.width = (max ? Math.min(100, cr / max * 100) : 0) + '%'; b.className = max && cr >= max ? 'ok' : ''; }
function setRing(id, avg, complete){
  var C = 314.16, a = avg === null ? 0 : avg;
  var arc = el('ra-' + id), st = avg !== null ? (avg >= 10 ? 'ok' : 'bad') : '';
  arc.setAttribute('stroke-dashoffset', (C * (1 - a / 20)).toFixed(2));
  arc.setAttribute('class', 'arc' + (st ? ' ' + st : ''));
  el('hero-' + id).className = 'hero' + (st === 'ok' ? ' pass' : st === 'bad' ? ' fail' : '');
  tween(el('sa-' + id), avg);
}
function status(avg, complete){ return avg !== null ? (avg >= 10 ? 'good' : 'bad') : ''; }

function update(){
  var semRes = {};
  SEMS.forEach(function(sem){
    var S = calcSem(sem); semRes[sem.id] = S;
    sem.ues.forEach(function(ue, i){
      var u = S.ues[i];
      var ua = el('ua-' + ue.code);
      ua.textContent = f2(u.avg);
      ua.className = 'ua ' + status(u.avg, u.complete);
      el('ue-' + ue.code).className = 'ue' + (state.c[ue.code] ? ' collapsed' : '') + (u.complete ? (u.avg >= 10 ? ' pass' : ' fail') : '');
      var c = el('uc-' + ue.code);
      if (u.n === 0) chip(c, t('noGrades'));
      else if (!u.complete) chip(c, u.n + '/' + u.total + ' ' + t('entered'), 'warn');
      else if (u.avg >= 10) chip(c, t('validated'), 'good');
      else chip(c, t('notVal'), 'bad');
      ue.mods.forEach(function(m){
        var r = calcMod(m);
        var st = r.done ? (r.avg >= 10 ? 'good' : 'bad') : '';
        var rb = el('r-' + m.id);
        rb.textContent = f2(r.avg);
        rb.className = 'badge' + (st ? ' ' + st : '');
        el('mod-' + m.id).className = 'mod' + (st === 'good' ? ' pass' : st === 'bad' ? ' fail' : '');
        var a = el('cc-' + m.id), b = el('ex-' + m.id), v = state.v[m.id] || {};
        var tone = st === 'good' ? ' ok' : st === 'bad' ? ' no' : '';
        if (a) a.className = 'g' + (Number.isNaN(num(v.cc)) ? ' err' : tone);
        b.disabled = m.cc === 1;
        b.className = 'g' + (Number.isNaN(num(v.ex)) ? ' err' : tone);
        var hint = el('h-' + m.id), msg = '', cls = '';
        if (r.bad){ msg = t('errRange'); cls = 'bad'; }
        else if (m.cc > 0 && m.cc < 1 && r.cc !== null && r.ex === null){
          var need = (10 - m.cc * r.cc) / (1 - m.cc);
          if (need <= 0){ msg = t('alreadyExam'); cls = 'good'; }
          else if (need > 20){ msg = t('noWayExam'); cls = 'bad'; }
          else { msg = t('needExam').replace('{x}', f2(need)); cls = 'warn'; }
        } else if (m.cc > 0 && m.cc < 1 && r.ex !== null && r.cc === null){
          var nc = (10 - (1 - m.cc) * r.ex) / m.cc;
          if (nc <= 0){ msg = t('alreadyCC'); cls = 'good'; }
          else if (nc > 20){ msg = t('noWayCC'); cls = 'bad'; }
          else { msg = t('needCC').replace('{x}', f2(nc)); cls = 'warn'; }
        }
        hint.textContent = msg; hint.className = 'hint ' + cls;
      });
    });
    setRing(sem.id, S.avg, S.complete);
    if (S.n === 0) setChip(el('sch-' + sem.id), t('noGrades'));
    else if (!S.complete) setChip(el('sch-' + sem.id), t('provMods') + ' · ' + S.n + '/' + S.total + ' ' + t('modules'), 'warn');
    else if (S.avg >= 10) setChip(el('sch-' + sem.id), t('validatedS'), 'good');
    else setChip(el('sch-' + sem.id), t('notValS'), 'bad');
    el('scr-' + sem.id).textContent = S.credits;
    el('scm-' + sem.id).textContent = S.crTotal;
    setBar('sb-' + sem.id, S.credits, S.crTotal);
    var ueOk = 0, modOk = 0, modAll = 0;
    S.ues.forEach(function(u){ if (u.complete && u.avg >= 10) ueOk++; });
    sem.ues.forEach(function(ue){ ue.mods.forEach(function(m){ modAll++; var rr = calcMod(m); if (rr.done && rr.avg >= 10) modOk++; }); });
    el('hst-' + sem.id).innerHTML = '<span class="stat">' + t('ueShort') + ' <b>' + ueOk + '/' + sem.ues.length + '</b></span><span class="stat">' + t('modShort') + ' <b>' + modOk + '/' + modAll + '</b></span>';
    el('emp-' + sem.id).hidden = S.n > 0;

    /* what-if planner */
    var tv = state.target[sem.id];
    if(document.activeElement !== el('tgv-' + sem.id)) el('tgv-' + sem.id).value = f2(tv);
    el('tgr-' + sem.id).value = tv * sc().k;
    var gt = el('gt-' + sem.id);
    if (S.complete){ gt.textContent = t('goalDone'); }
    else {
      var rem = S.coefTotal - S.sw, needAvg = (tv * S.coefTotal - S.s) / rem;
      if (needAvg <= 0) gt.innerHTML = '<span class="good">' + t('goalSecure').replace('{t}', f2(tv)) + '</span>';
      else if (needAvg > 20) gt.innerHTML = '<span class="bad">' + t('goalNo') + '</span>';
      else gt.innerHTML = t('goalNeed').replace('{t}', f2(tv)).replace('{x}', f2(needAvg)).replace('{c}', rem);
    }

    /* breakdown */
    var bk = '<tr><th>' + t('thMod') + '</th><th>' + t('thCoef') + '</th><th>' + t('thAvg') + '</th><th>' + t('thPts') + '</th></tr>', pts = 0;
    sem.ues.forEach(function(ue){ ue.mods.forEach(function(m){
      var r = calcMod(m), pp = r.done ? m.coef * r.avg / S.coefTotal : null;
      if (pp !== null) pts += pp;
      bk += '<tr><td>' + esc(modName(m)) + '</td><td>' + m.coef + '</td><td class="' + (r.done ? (r.avg >= 10 ? 'good' : 'bad') : '') + '">' + f2(r.avg) + '</td><td>' + f2(pp) + '</td></tr>';
    }); });
    bk += '<tr class="tot"><td colspan="3">' + t('total') + '</td><td>' + f2(S.n ? pts : null) + '</td></tr>';
    el('bkt-' + sem.id).innerHTML = bk;
  });

  var a1 = semRes.s1, a2 = semRes.s2;
  var avs = [a1, a2].filter(function(s){ return s.avg !== null; });
  var yAvg = avs.length ? avs.reduce(function(a, s){ return a + s.avg; }, 0) / avs.length : null;
  var yDone = a1.complete && a2.complete;
  setRing('y', yAvg, yDone);
  el('y-s1').textContent = f2(a1.avg); el('y-s2').textContent = f2(a2.avg);
  el('y-s1').className = 'mv ' + status(a1.avg, a1.complete);
  el('y-s2').className = 'mv ' + status(a2.avg, a2.complete);
  el('yc-s1').textContent = a1.credits; el('yc-s2').textContent = a2.credits;
  el('ym-s1').textContent = a1.crTotal; el('ym-s2').textContent = a2.crTotal;
  setBar('yb-s1', a1.credits, a1.crTotal); setBar('yb-s2', a2.credits, a2.crTotal);
  el('scr-y').textContent = a1.credits + a2.credits;
  el('scm-y').textContent = a1.crTotal + a2.crTotal;
  setBar('sb-y', a1.credits + a2.credits, a1.crTotal + a2.crTotal);
  var tU = 0, okU = 0, tM = 0, okM = 0;
  SEMS.forEach(function(sem){
    semRes[sem.id].ues.forEach(function(u){ tU++; if (u.complete && u.avg >= 10) okU++; });
    sem.ues.forEach(function(ue){ ue.mods.forEach(function(m){ tM++; var rr = calcMod(m); if (rr.done && rr.avg >= 10) okM++; }); });
  });
  el('hst-y').innerHTML = '<span class="stat">' + t('ueShort') + ' <b>' + okU + '/' + tU + '</b></span><span class="stat">' + t('modShort') + ' <b>' + okM + '/' + tM + '</b></span>';
  var ym = el('y-mention'); ym.textContent = yDone ? mention(yAvg) : '—'; ym.className = status(yAvg, yDone);
  if (yAvg === null) setChip(el('sch-y'), t('noGrades'));
  else if (!yDone) setChip(el('sch-y'), avs.length === 2 ? t('yProvMissing') : t('yProvOne'), 'warn');
  else if (yAvg >= 10) setChip(el('sch-y'), t('yVal'), 'good');
  else setChip(el('sch-y'), t('yNot'), 'bad');

  var bars = '';
  SEMS.forEach(function(sem){
    bars += '<div class="bgrp">' + t(sem.id) + '</div>';
    sem.ues.forEach(function(ue){ ue.mods.forEach(function(m){
      var r = calcMod(m);
      bars += '<div class="brow"><div class="bl">' + esc(modName(m)) + '</div><div class="bt"><i class="bf ' + (r.done ? (r.avg >= 10 ? 'good' : 'bad') : '') + '" style="width:' + (r.done ? (r.avg / 20 * 100).toFixed(1) : 0) + '%"></i><u></u></div><div class="bv ' + (r.done ? (r.avg >= 10 ? 'good' : 'bad') : '') + '">' + f2(r.avg) + '</div></div>';
    }); });
  });
  el('bars').innerHTML = bars;
  var dn = [];
  SEMS.forEach(function(sem){ sem.ues.forEach(function(ue){ ue.mods.forEach(function(m){ var rr = calcMod(m); if (rr.done) dn.push({ n:modName(m), a:rr.avg }); }); }); });
  function ins(label, sub, val, cls){ return '<div class="ins"><div class="cap">' + label + '</div><div class="iv ' + cls + '">' + val + '</div><div class="isub">' + esc(sub) + '</div></div>'; }
  if (!dn.length) el('ins').innerHTML = '<div class="ins empty2">' + EMPTY_SVG + '<span>' + t('noDataYet') + '</span><button class="btn" type="button" data-act="view:s1">' + t('goS1') + '</button></div>';
  else {
    dn.sort(function(x, y){ return y.a - x.a; });
    var bst = dn[0], low = dn[dn.length - 1], pc = dn.filter(function(x){ return x.a >= 10; }).length;
    el('ins').innerHTML = ins(t('best'), bst.n, f2(bst.a), bst.a >= 10 ? 'good' : 'bad') + ins(t('lowest'), low.n, f2(low.a), low.a >= 10 ? 'good' : 'bad') + ins(t('passedMods'), dn.length + '/' + tM + ' ' + t('entered'), pc + '/' + dn.length, pc === dn.length ? 'good' : 'warn');
  }

  var rows = '<tr><th>' + t('thMod') + '</th><th>' + t('thCoef') + '</th><th>CC</th><th>' + t('thEx') + '</th><th>' + t('thAvg') + '</th></tr>';
  SEMS.forEach(function(sem){
    rows += '<tr class="semh"><td colspan="4">' + t(sem.id) + '</td><td>' + f2(semRes[sem.id].avg) + '</td></tr>';
    sem.ues.forEach(function(ue, i){
      var u = semRes[sem.id].ues[i];
      rows += '<tr class="ueh"><td colspan="4">' + ue.code + '</td><td>' + f2(u.avg) + '</td></tr>';
      ue.mods.forEach(function(m){
        var r = calcMod(m);
        rows += '<tr><td>' + esc(modName(m)) + '</td><td>' + m.coef + '</td><td>' + (m.cc > 0 ? f2(Number.isNaN(r.cc) ? null : r.cc) : '–') + '</td><td>' + f2(Number.isNaN(r.ex) ? null : r.ex) + '</td><td class="' + (r.done ? (r.avg >= 10 ? 'good' : 'bad') : '') + '">' + f2(r.avg) + '</td></tr>';
      });
    });
  });
  el('tr').innerHTML = rows;
  [['s1',a1.avg],['s2',a2.avg],['y',yAvg]].forEach(function(pair){var node=el('nv-'+pair[0]);node.textContent=f2(pair[1]);node.className='nv '+status(pair[1],true);});
  return { s1:a1, s2:a2, y:yAvg, yDone:yDone };
}

function summaryText(){
  var R = update();
  var L = [t('sumTitle'), SPECIALITIES[state.speciality].name];
  SEMS.forEach(function(sem){
    var S = R[sem.id];
    L.push('', t(sem.id) + ' — ' + f2(S.avg) + ' / ' + maxText() + ' · ' + S.credits + '/' + S.crTotal + ' ' + t('credits'));
    sem.ues.forEach(function(ue, i){
      L.push('  ' + ue.code + ' — ' + f2(S.ues[i].avg));
      ue.mods.forEach(function(m){var r=calcMod(m); L.push('    ' + modName(m) + ' | '+t('cc')+': '+(m.cc ? f2(r.cc):'–')+' | '+t('ex')+': '+(m.cc < 1 ? f2(r.ex):'–')+' | '+t('thAvg')+': '+f2(r.avg)); });
    });
  });
  var cr = R.s1.credits + R.s2.credits, crT = R.s1.crTotal + R.s2.crTotal;
  L.push('', t('annual') + ': ' + f2(R.y) + ' / ' + maxText() + ' · ' + cr + '/' + crT + ' ' + t('credits') + (R.yDone ? ' · ' + mention(R.y) : ''));

document.addEventListener('pointerdown', function(e){
  var b = e.target.closest ? e.target.closest('button, summary') : null;
  if (!b || b.disabled) return;
  var r = b.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2;
  var s = document.createElement('span');
  s.className = 'ripple';
  s.style.width = s.style.height = size + 'px';
  s.style.left = (e.clientX - r.left - size / 2) + 'px';
  s.style.top = (e.clientY - r.top - size / 2) + 'px';
  b.appendChild(s);
  setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 600);
  buzz(5);
});

document.addEventListener('input', function(e){
  var tg = e.target;
  if (!tg.matches) return;
  if (tg.id === 'nm'){ state.name = tg.value; save(); greet(); return; }
  if (tg.matches('input.target-number')){ var target = Number(tg.value); if(tg.value !== '' && isFinite(target) && target >= 0 && target <= sc().max){state.target[tg.dataset.s] = target/sc().k;save();update();} return; }
  if (tg.matches('input.tgr')){ state.target[tg.getAttribute('data-s')] = Math.min(20, parseFloat(tg.value) / sc().k); save(); update(); return; }
  if (tg.matches('input.g')){
    var id = tg.getAttribute('data-m'), k = tg.getAttribute('data-k');
    state.v[id] = state.v[id] || {};
    state.v[id][k] = tg.value;
    save(); update();
  }
});
function changeSpeciality(next){

  var saved = state.profiles[next] || defaults();
  ['v','o','c','custom','target','scale'].forEach(function(k){ state[k] = saved[k]; });
  state.speciality = next;
  if (armed) { clearTimeout(armTimer); armed = false; }
  clearTimeout(snackTimer); el('snack').hidden = true; el('snack-a').onclick = null;
  save(); SEMS = composeSems(); buildAll();
}

    '<div class="tf sel"><select id="sh-ue" data-sem="' + sem.id + '">' + opts + '</select><label for="sh-ue">' + t('mUE') + '</label></div>' +
    '<div class="two"><div class="tf"><input id="sh-coef" type="text" inputmode="decimal" placeholder=" " autocomplete="off"><label for="sh-coef">' + t('mCoef') + '</label></div>' +
    '<div class="tf"><input id="sh-cr" type="text" inputmode="decimal" placeholder=" " autocomplete="off"><label for="sh-cr">' + t('mCr') + '</label></div></div>' +
     '<div class="tf"><input id="sh-weight" type="number" min="0" max="100" value="40" placeholder=" "><label for="sh-weight">' + t('mCC') + ' (%)</label></div>' +
    '<div class="err" id="sh-err" role="alert"></div>' +
    '<div class="actions"><button class="btn" type="button" data-act="sheet:close">' + t('cancel') + '</button><button class="btn primary" type="button" data-act="sheet:save">' + t('add') + '</button></div>';
  el('sheet').hidden = false;
  setTimeout(function(){ var n = el('sh-name'); if (n) n.focus(); }, 60);
}
function closeSheet(){ el('sheet').hidden = true;el('fab').focus(); }
function saveSheet(){
  var name = el('sh-name').value.trim(), ue = el('sh-ue').value, sem = el('sh-ue').getAttribute('data-sem');
  var coef = Number(el('sh-coef').value.replace(',', '.')), cr = Number(el('sh-cr').value.replace(',', '.'));

  if(el('sh-weight').value === '' || !isFinite(sheetCC) || sheetCC < 0 || sheetCC > 1) err = state.lang === 'fr' ? 'Poids : de 0 à 100 %.' : 'Weight must be between 0 and 100%.';

  state.custom.push({ id:'x' + Date.now().toString(36), sem:sem, ue:ue, name:name, coef:coef, cr:cr, cc:sheetCC });
  save(); SEMS = composeSems(); closeSheet(); buildAll(); buzz(18);
  snack(t('added'));
}
function deleteCustom(id){
  var idx = -1;
  state.custom.forEach(function(c, i){ if (c.id === id) idx = i; });
  if (idx < 0) return;
  var item = state.custom.splice(idx, 1)[0];
  save(); SEMS = composeSems(); buildAll();
  snack(t('deleted'), t('undo'), function(){ state.custom.splice(Math.min(idx, state.custom.length), 0, item); save(); SEMS = composeSems(); buildAll(); });
}

var armed = false, armTimer = null;
document.addEventListener('click', function(e){
  var tog = e.target.closest ? e.target.closest('[data-toggle]') : null;
  if (tog){
    var code = tog.getAttribute('data-toggle');

  }
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b) return;
  var parts = b.getAttribute('data-act').split(':'), act = parts[0], arg = parts[1];
  if (act === 'theme') setTheme(arg);
  else if (act === 'lang'){ state.lang = arg; save(); buildAll(); }
  else if (act === 'scale') setScale(arg);
  else if (act === 'add') openSheet();
  else if (act === 'sheet'){ if (arg === 'close') closeSheet(); else saveSheet(); }
  else if (act === 'shw'){
    sheetCC = arg === '40' ? .4 : 0;
    Array.prototype.forEach.call(b.parentNode.children, function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  }
  else if (act === 'del') deleteCustom(arg);
  else if (act === 'view') show(arg);
  else if (act === 'focusfirst'){
    var unit=SEMS.filter(function(s){return s.id===arg;})[0].ues[0];state.c[unit.code]=0;el('ue-'+unit.code).classList.remove('collapsed');el('ue-'+unit.code).querySelector('button').setAttribute('aria-expanded','true');save();
    var f = el((unit.mods[0].cc > 0 ? 'cc-' : 'ex-') + unit.mods[0].id);
    if (f){ try { f.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(x){} f.focus(); }
  }
  else if (act === 'lock'){
    if (arg === 'set') showLock('set1', false);
    else if (arg === 'change') showLock('vchange');
    else if (arg === 'remove') showLock('vremove');
    else if (arg === 'now') showLock('verify');
  }
  else if (act === 'copy'){
    var text = summaryText(), fb = el('fallback');
    var done = function(){ b.textContent = t('copied'); fb.hidden = true; setTimeout(function(){ b.textContent = t('copy'); }, 1800); };
    var manual = function(){ show('set'); fb.hidden = false; fb.value = text; fb.focus(); fb.select(); };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, manual); else manual(); } catch(err){ manual(); }
  }
  else if (act === 'reset'){
    if (!armed){
      armed = true; b.textContent = t('resetSure'); b.className = 'btn danger';
      armTimer = setTimeout(function(){ armed = false; b.textContent = t('reset'); b.className = 'btn'; }, 3500);
      return;
    }
    clearTimeout(armTimer); armed = false;
    state.v = {}; Object.keys(state.profiles).forEach(function(k){state.profiles[k].v={};}); state.target = { s1:10, s2:10 }; save(); SEMS = composeSems(); buildAll();
  }
});
el('b-lang').addEventListener('click', function(){state.lang = state.lang === 'fr' ? 'en' : 'fr'; save(); buildAll();});
el('b-theme').addEventListener('click', function(){ setTheme(state.theme === 'auto' ? 'light' : state.theme === 'light' ? 'dark' : 'auto'); });
el('b-lock').addEventListener('click', function(){ showLock('verify'); });

/* ---------- pattern lock ---------- */
var L = { mode:null, tmp:null, wrong:state.lockWrong || 0, until:state.lockUntil || 0, first:false, busy:false, timer:null, seq:[], drawing:false, geo:null, resetArmed:false };
var pad = el('pad'), padSvg;
(function initPad(){
  var h = '<svg id="pad-svg" aria-hidden="true"></svg>';
  for (var i = 0; i < 9; i++){
    h += '<button type="button" aria-label="' + (i+1) + '" class="dot" data-i="' + i + '" style="left:' + ((i % 3) * 33.333 + 16.667).toFixed(3) + '%;top:' + (Math.floor(i / 3) * 33.333 + 16.667).toFixed(3) + '%"></button>';
  }
  pad.innerHTML = h; padSvg = el('pad-svg');
})();
function hashPattern(code){
  var s = 'afa:' + code;
  if (window.crypto && crypto.subtle && window.TextEncoder){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
    });
  }
  var a = 5381, b = 52711;
  for (var i = 0; i < s.length; i++){ a = ((a * 33) ^ s.charCodeAt(i)) >>> 0; b = ((b * 31) + s.charCodeAt(i) * 7) >>> 0; }
  var hex = ('00000000' + a.toString(16)).slice(-8) + ('00000000' + b.toString(16)).slice(-8);
  return Promise.resolve((hex + hex + hex + hex).slice(0, 64));
}
function lkMsg(text, cls){ var m = el('lk-msg'); m.textContent = text || ''; m.className = cls || ''; }
function showLock(mode, first){
  L.mode = mode; L.tmp = null; L.busy = false;
  if (first !== undefined) L.first = !!first;
  el('lock').hidden = false;
  document.body.style.overflow = 'hidden';
  document.querySelector('.wrap').inert=true;mainNav && (mainNav.inert=true);el('fab').inert=true;
  setTimeout(function(){pad.querySelector('.dot').focus();},0);
  el('lk-forgotbox').hidden = true; L.resetArmed = false;
  lockTexts();
  clearPad();
  if(Date.now()<L.until){clearInterval(L.timer);var tick=function(){var seconds=Math.ceil((L.until-Date.now())/1000);if(seconds<=0){clearInterval(L.timer);lkMsg('');}else lkMsg(t('lkWait').replace('{s}',seconds),'bad');};tick();L.timer=setInterval(tick,500);}
}
function lockTexts(){
  var m = L.mode;
  el('lk-title').textContent = m === 'verify' ? t('lkVerify') : (m === 'vchange' || m === 'vremove') ? t('lkCurrent') : m === 'set2' ? t('lkConfirm') : t('lkNew');
  if (m === 'set1') lkMsg(t('lkNote') + ' ' + t('patNote')); else if (!(Date.now() < L.until)) lkMsg('');
  el('lk-skip').textContent = t('lkSkip'); el('lk-skip').hidden = !(m === 'set1' && L.first);
  el('lk-cancel').textContent = t('lkCancel'); el('lk-cancel').hidden = !((m === 'set1' && !L.first) || (m === 'set2' && !L.first) || m === 'vchange' || m === 'vremove');
  el('lk-forgot').textContent = t('lkForgot'); el('lk-forgot').hidden = !(m === 'verify');
  el('lk-fwarn').textContent = t('lkFwarn'); el('lk-freset').textContent = t('lkFreset');
}
function hideLock(){ document.querySelector('.wrap').inert=false;mainNav.inert=false;el('fab').inert=false; el('lock').hidden = true; document.body.style.overflow = ''; L.mode=null; clearPad(); }
function clearPad(){
  L.seq = []; L.drawing = false;
  pad.className = '';
  padSvg.innerHTML = '';
  Array.prototype.forEach.call(pad.querySelectorAll('.dot'), function(d){ d.classList.remove('on'); });
}
function centers(){
  var r = pad.getBoundingClientRect(), c = [];
  for (var i = 0; i < 9; i++) c.push({ x:(i % 3 + .5) * r.width / 3, y:(Math.floor(i / 3) + .5) * r.height / 3 });
  return { r:r, c:c };
}
function drawPad(cur){
  var g = L.geo, pts = L.seq.map(function(i){ return g.c[i].x + ',' + g.c[i].y; });
  if (cur && L.seq.length) pts.push(cur.x + ',' + cur.y);
  padSvg.setAttribute('viewBox', '0 0 ' + g.r.width + ' ' + g.r.height);
  padSvg.innerHTML = pts.length > 1 ? '<polyline points="' + pts.join(' ') + '"/>' : '';
  Array.prototype.forEach.call(pad.querySelectorAll('.dot'), function(d){ d.classList.toggle('on', L.seq.indexOf(+d.getAttribute('data-i')) >= 0); });
}
function addDot(i){
  if (L.seq.indexOf(i) >= 0) return;
  if (L.seq.length){
    var a = L.seq[L.seq.length - 1], ra = Math.floor(a / 3), ca = a % 3, rb = Math.floor(i / 3), cb = i % 3;
    if ((ra + rb) % 2 === 0 && (ca + cb) % 2 === 0 && Math.abs(ra - rb) + Math.abs(ca - cb) > 0 && (Math.abs(ra - rb) === 2 || Math.abs(ca - cb) === 2)){
      var mid = ((ra + rb) / 2) * 3 + (ca + cb) / 2;
      if (L.seq.indexOf(mid) < 0) L.seq.push(mid);
    }
  }
  L.seq.push(i); buzz(8);
}
function moveTo(e){
  var g = L.geo, p = { x:e.clientX - g.r.left, y:e.clientY - g.r.top };
  for (var i = 0; i < 9; i++){
    var dx = p.x - g.c[i].x, dy = p.y - g.c[i].y;
    if (Math.sqrt(dx * dx + dy * dy) < g.r.width * 0.11) addDot(i);
  }
  drawPad(p);
}
pad.addEventListener('pointerdown', function(e){
  if (L.busy || Date.now() < L.until) return;
  e.preventDefault();
  clearPad();
  L.geo = centers(); L.drawing = true;
  try { pad.setPointerCapture(e.pointerId); } catch(err){}
  moveTo(e);
});
pad.addEventListener('pointermove', function(e){ if (L.drawing) moveTo(e); });
function endDraw(){
  if (!L.drawing) return;
  L.drawing = false;
  drawPad(null);
  if (!L.seq.length) return;
  if (L.seq.length < 4 && (L.mode === 'set1' || L.mode === 'set2')){ flash('bad'); lkMsg(t('lkShort'), 'bad'); return; }
  var code = L.seq.map(function(n){ return n + 1; }).join('');
  L.busy = true;
  hashPattern(code).then(function(h){ handle(code, h); });
}
pad.addEventListener('pointerup', endDraw);
pad.addEventListener('pointercancel', clearPad);
function flash(cls){
  pad.className = cls; buzz(cls === 'bad' ? [30, 40, 30] : 18);
  setTimeout(function(){ if (L.mode) { clearPad(); L.busy = false; } }, 650);
}
function handle(code, h){
  var m = L.mode;
  if (m === 'verify' || m === 'vchange' || m === 'vremove'){
    if (h === state.lock){
      L.wrong = 0; state.lockWrong=0; state.lockUntil=0; save(); lkMsg('', '');
      if (m === 'verify'){ flash('good'); setTimeout(hideLock, 250); }
      else if (m === 'vchange'){ flash('good'); setTimeout(function(){ showLock('set1', false); }, 700); }
      else { state.lock = 'off'; save(); flash('good'); setTimeout(function(){ hideLock(); buildSettings(); }, 300); }
      return;
    }
    L.wrong++; state.lockWrong=L.wrong; save();
    flash('bad');
    if (L.wrong >= 5){
      L.wrong = 0; L.until = Date.now() + 30000; state.lockWrong=0;state.lockUntil=L.until;save();
      clearInterval(L.timer);
      var tick = function(){
        var s = Math.ceil((L.until - Date.now()) / 1000);
        if (s <= 0){ clearInterval(L.timer); lkMsg('', ''); return; }
        lkMsg(t('lkWait').replace('{s}', s), 'bad');
      };
      tick(); L.timer = setInterval(tick, 500);
    } else lkMsg(t('lkWrong'), 'bad');
    return;
  }
  if (m === 'set1'){ L.tmp = code; flash('good'); setTimeout(function(){ L.mode = 'set2'; lockTexts(); lkMsg(''); L.busy = false; }, 700); return; }
  if (m === 'set2'){
    if (code === L.tmp){
      state.lock = h; save(); flash('good'); lkMsg(t('lkSaved'), 'good');
      setTimeout(function(){ hideLock(); buildSettings(); }, 500);
    } else { flash('bad'); lkMsg(t('lkMismatch'), 'bad'); L.tmp = null; setTimeout(function(){ L.mode = 'set1'; lockTexts(); lkMsg(t('lkMismatch'), 'bad'); }, 700); }
  }
}
el('lk-skip').addEventListener('click', function(){ state.lock = 'off'; save(); hideLock(); buildSettings(); });
el('lk-cancel').addEventListener('click', function(){ hideLock(); });
el('lk-forgot').addEventListener('click', function(){ var b = el('lk-forgotbox'); b.hidden = !b.hidden; });
el('lk-freset').addEventListener('click', function(){
  var b = el('lk-freset');
  if (!L.resetArmed){ L.resetArmed = true; b.textContent = t('lkFsure'); setTimeout(function(){ L.resetArmed = false; b.textContent = t('lkFreset'); }, 3500); return; }
  L.resetArmed = false;
  localStorage.removeItem('moyenne-master-vscode-v2');localStorage.removeItem('moyenne-afa-v1');L.wrong=0;L.until=0;clearInterval(L.timer);
  state = defaults(); save(); SEMS = composeSems(); buildAll();
  showLock('set1', true);
});
document.addEventListener('visibilitychange', function(){
  if (document.hidden && lockOn() && el('lock').hidden) showLock('verify');
});

document.addEventListener('keydown', function(e){
 if(!el('sheet').hidden && el('lock').hidden && e.key==='Tab'){var fields=Array.from(el('sheet-body').querySelectorAll('button,input,select'));var first=fields[0],last=fields[fields.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
 if(!el('lock').hidden){
   if(e.key === 'Tab'){var nodes=Array.from(el('lock').querySelectorAll('button')).filter(function(n){return n.offsetParent!==null;});if(e.shiftKey && document.activeElement===nodes[0]){e.preventDefault();nodes[nodes.length-1].focus();}else if(!e.shiftKey && document.activeElement===nodes[nodes.length-1]){e.preventDefault();nodes[0].focus();}}
   if(e.target.matches('.dot') && !L.busy && Date.now()>=L.until){
     if(e.key===' '){e.preventDefault();if(!L.geo)L.geo=centers();addDot(+e.target.dataset.i);drawPad(null);}
     if(e.key==='Enter'){e.preventDefault();L.drawing=true;endDraw();}
     if(e.key==='Backspace'){e.preventDefault();clearPad();}
   }
 }else if(e.key==='Escape' && !el('sheet').hidden)closeSheet();
});
